# Fixture policy for the parity corpus. Exercises every evaluation stage.
mode = "strict-allow"

[hosts]
allow = ["allowed.test", "*.allowed.test", "api.vendor.test", "readonly.test"]
block = ["blocked.test", "*.telemetry.test"]

[[paths.allow]]
host = "blocked.test"
path = "/docs/*"

[[paths.block]]
host = "api.vendor.test"
path = "*/telemetry*"

[[paths.block]]
host = "*"
path = "/phone-home/*"

# Method gate (#66): readonly.test is read-only, with POST excepted on the
# two paths that query by POST; a 32-character token case lives in the corpus.
[[methods.restrict]]
host = "readonly.test"
allow = ["GET", "HEAD"]

[[methods.except]]
host = "readonly.test"
path = "/search"
methods = ["POST"]

[[methods.except]]
host = "readonly.test"
path = "/redirect"
methods = ["POST"]
