# tjor cage topology. Driven by bin/tjor, which exports every TJOR_* variable.
#
# Layout (charter L1/L2/L28): the agent lives on an internal-only network;
# proxy and dns sidecars are created on the egress network FIRST and then
# connected to the internal network by the launcher (docker network connect)
# — published ports and route-derived addresses bind against the creation-
# time network, so the ordering is load-bearing. The agent reaches sidecars
# by their internal IPs, exported by the launcher after connection.

name: ${TJOR_PROJECT:-tjor}

networks:
  # The internal network is created by the launcher (docker network create
  # --internal) BEFORE compose runs, so sidecars are provably created on the
  # egress network first and connected to internal second (charter L28).
  internal:
    external: true
    name: ${TJOR_PROJECT:-tjor}_internal
  egress: {}

# The proxy confdir (session CA) is a session-dir bind mount: the launcher
# pre-generates a CONSTRAINED CA there (basicConstraints pathlen:0 + EKU
# serverAuth, charter L25). Only the CERT is ever mounted into the agent;
# the private key stays in the sidecar-only directory.

services:
  proxy:
    image: ${TJOR_PROXY_IMAGE:?}
    networks: [egress]
    restart: unless-stopped
    mem_limit: ${TJOR_PROXY_MEM:-1g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # tjor's own entrypoint (as root) stats the bind-mounted confdir, aligns
    # the mitmproxy user's uid (usermod), then drops privileges via gosu.
    cap_add: [SETUID, SETGID, CHOWN, DAC_READ_SEARCH]
    environment:
      TJOR_IP_GUARD: ${TJOR_IP_GUARD:-on}
      # Session identity registration (D1): the proxy verifies outbound
      # x-agent-* headers against these and strips forgeries; injection only
      # for TJOR_INJECT_HOSTS matches.
      TJOR_SESSION_ID: ${TJOR_SESSION_ID:-}
      TJOR_TASK_ID: ${TJOR_TASK_ID:-}
      TJOR_HARNESS: ${TJOR_HARNESS:-}
      TJOR_REPO: ${TJOR_REPO:-}
      TJOR_WORKTREE: ${TJOR_WORKTREE:-}
      TJOR_PARENT_SESSION: ${TJOR_PARENT_SESSION:-}
      TJOR_INJECT_HOSTS: ${TJOR_INJECT_HOSTS:-}
      # Credential broker (D2): config lives ONLY here (egress side). Empty
      # when disabled. The addon injects the real credential toward
      # TJOR_BROKER_HOSTS only; the agent never sees it.
      TJOR_BROKER_CONFIG: ${TJOR_BROKER_ENABLED:+/broker/broker.json}
      TJOR_BROKER_HOSTS: ${TJOR_BROKER_HOSTS:-}
      # Session denial log (#23): the addon appends each denied egress here so
      # `tjor denials` can surface what got blocked.
      TJOR_DENIAL_LOG: /denials.log
      # LLM gateway (D4): the proxy injects this generated master key toward the
      # gateway host ONLY, and exempts that host from the SSRF guard. Both live
      # only here (egress side); the agent holds a placeholder. Empty = disabled.
      TJOR_GATEWAY_HOST: ${TJOR_GATEWAY_HOST:-}
      TJOR_GATEWAY_KEY: ${TJOR_GATEWAY_KEY:-}
    labels:
      tjor.role: proxy
      tjor.session: ${TJOR_SESSION:-}
      tjor.launched-at: ${TJOR_LAUNCHED_AT:-}
      tjor.confighash: ${TJOR_CONFIG_HASH:-unset}
    volumes:
      - ${TJOR_SESSION_DIR:?}/policy.toml:/policy/policy.toml:ro
      - ${TJOR_SESSION_DIR:?}/proxy-ca:/home/mitmproxy/.mitmproxy
      # Broker dir (config + App key) mounted read-only into the proxy ONLY.
      # Points at a real dir when disabled (compose needs an existing source).
      - ${TJOR_BROKER_DIR:-${TJOR_SESSION_DIR:?}/proxy-ca}:/broker:ro
      # Session denial log (writable): the launcher pre-creates the file.
      - ${TJOR_SESSION_DIR:?}/denials.log:/denials.log
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', ${TJOR_PROXY_PORT:-8080}), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    command:
      [
        "mitmdump",
        "--mode", "regular",
        "--listen-host", "0.0.0.0",
        "--listen-port", "${TJOR_PROXY_PORT:-8080}",
        "-s", "/addon/addon.py",
        "--set", "stream_large_bodies=1m",
        # rawtcp DEFAULTS TO TRUE in mitmproxy: without this, a non-TLS/non-
        # HTTP byte stream through a CONNECT tunnel is relayed raw, bypassing
        # request-stage policy (found by external re-review; conformance
        # probes this now).
        "--set", "rawtcp=false",
      ]

  dns:
    image: ${TJOR_COREDNS_IMAGE:?}
    networks: [egress]
    restart: unless-stopped
    mem_limit: ${TJOR_DNS_MEM:-256m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # binds :53
    labels:
      tjor.role: dns
      tjor.session: ${TJOR_SESSION:-}
      tjor.launched-at: ${TJOR_LAUNCHED_AT:-}
      tjor.confighash: ${TJOR_CONFIG_HASH:-unset}
    volumes:
      - ${TJOR_SESSION_DIR:?}/Corefile:/Corefile:ro
    command: ["-conf", "/Corefile"]

  agent:
    profiles: [agent]
    image: ${TJOR_AGENT_IMAGE:-tjor-agent-opencode:local}
    networks: [internal]
    mem_limit: ${TJOR_AGENT_MEM:-4g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]   # entrypoint setup (writes into agent-owned home), then gosu drop
    # The sidecar IPs are discovered by the launcher after network connect.
    # The fallbacks are DELIBERATELY invalid sentinels, not usable values:
    # docker rejects a non-IP dns value at CREATE time (verified: 'invalid
    # argument "unset-dns-ip" for "--dns" flag'), and the unset proxy
    # sentinel points at an unresolvable name on a closed network — a
    # missing discovery step fails hard instead of silently downgrading.
    dns:
      - ${TJOR_DNS_IP:-unset-dns-ip}
    environment:
      HTTP_PROXY: &proxyurl http://${TJOR_PROXY_IP:-unset-proxy-ip}:${TJOR_PROXY_PORT:-8080}
      HTTPS_PROXY: *proxyurl
      http_proxy: *proxyurl
      https_proxy: *proxyurl
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      NODE_EXTRA_CA_CERTS: /etc/tjor/ca/ca.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      TJOR_SESSION: ${TJOR_SESSION:-}
      TJOR_SESSION_ID: ${TJOR_SESSION_ID:-}
      TJOR_TASK_ID: ${TJOR_TASK_ID:-}
      TJOR_HARNESS: ${TJOR_HARNESS:-}
      TJOR_REPO: ${TJOR_REPO:-}
      TJOR_WORKTREE: ${TJOR_WORKTREE:-}
      TJOR_PARENT_SESSION: ${TJOR_PARENT_SESSION:-}
      # Broker (D2): tells the entrypoint to wire a PLACEHOLDER git credential
      # so git attempts auth; the proxy overwrites it with the real token.
      # The real credential is never passed to the agent.
      TJOR_BROKER_ENABLED: ${TJOR_BROKER_ENABLED:-}
      # Kube broker (#26): the API server URL the entrypoint renders a
      # PLACEHOLDER kubeconfig for (empty unless the kube broker is active).
      # Only the server address — never a token — is passed to the agent.
      TJOR_KUBE_SERVER: ${TJOR_KUBE_SERVER:-}
      # Host uid for runtime alignment (uid-agnostic image, #21).
      TJOR_AGENT_UID: ${TJOR_AGENT_UID:-}
    volumes:
      - ${TJOR_SESSION_DIR:?}/home:/home/agent
      - ${TJOR_WORKSPACE:-/dev/null}:${TJOR_WORKSPACE:-/tmp/.tjor-nows}
      - ${TJOR_SESSION_DIR:?}/ca.pem:/etc/tjor/ca/ca.pem:ro
    # Discovery labels (D3): lifecycle tooling reads these, never names.
    labels:
      tjor.role: agent
      tjor.session: ${TJOR_SESSION:-}
      tjor.workspace: ${TJOR_WORKSPACE:-}
      tjor.harness: ${TJOR_HARNESS:-}
      tjor.task: ${TJOR_TASK_ID:-}
      tjor.launched-at: ${TJOR_LAUNCHED_AT:-}
    working_dir: ${TJOR_LAUNCH_DIR:-/home/agent}
    hostname: tjor
    stdin_open: true
    tty: true

  conformance:
    profiles: [conformance]
    image: ${TJOR_CONFORMANCE_IMAGE:-tjor-conformance:local}
    networks: [internal]
    mem_limit: ${TJOR_CONFORMANCE_MEM:-512m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    dns:
      - ${TJOR_DNS_IP:-unset-dns-ip}
    labels:
      tjor.role: conformance
      tjor.session: ${TJOR_SESSION:-}
      tjor.launched-at: ${TJOR_LAUNCHED_AT:-}
    environment:
      TJOR_PROXY_IP: ${TJOR_PROXY_IP:-}
      TJOR_DNS_IP: ${TJOR_DNS_IP:-}
      TJOR_PROXY_PORT: ${TJOR_PROXY_PORT:-8080}
      TJOR_SESSION_ID: ${TJOR_SESSION_ID:-}
      # The stub broker token the proxy injects; the probe asserts it arrives
      # at the echo host AND is absent from this container.
      TJOR_TEST_BROKER_TOKEN: ${TJOR_TEST_BROKER_TOKEN:-}

  # Egress-side header-echo fixture (conformance only): the identity probes
  # need an "upstream" that reflects what actually arrived after the proxy's
  # verify/strip/inject stage.
  echo:
    profiles: [conformance]
    image: ${TJOR_CONFORMANCE_IMAGE:-tjor-conformance:local}
    entrypoint: ["python3", "/echo.py"]
    networks:
      egress:
        aliases:
          - echo-inject.tjor-test
          - echo-noinject.tjor-test
          - echo-broker.tjor-test
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # LLM gateway (D4): LiteLLM on the EGRESS network only — reachable by the agent
  # solely through the proxy (never connected to internal). The alias is the
  # single gateway host the proxy resolves + allows (inference paths only). The
  # generated master key arrives via LITELLM_MASTER_KEY; provider keys via the
  # env_file, mounted here alone. Started only when the launcher names it (the
  # gateway profile keeps it out of any bare `compose up`). :- fallbacks so
  # compose operations on the other services don't require these vars when off.
  litellm:
    profiles: [gateway]
    image: ${TJOR_LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    networks:
      egress:
        aliases:
          - ${TJOR_GATEWAY_HOST:-tjor-gateway}
    mem_limit: ${TJOR_GATEWAY_MEM:-2g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      LITELLM_MASTER_KEY: ${TJOR_GATEWAY_KEY:-}
    env_file:
      - ${TJOR_GATEWAY_ENV_MOUNT:-/dev/null}
    volumes:
      - ${TJOR_GATEWAY_CONFIG_MOUNT:-/dev/null}:/etc/litellm/config.yaml:ro
    command: ["--config", "/etc/litellm/config.yaml", "--port", "${TJOR_GATEWAY_PORT:-4000}"]
    labels:
      tjor.role: gateway
      tjor.session: ${TJOR_SESSION:-}
      tjor.launched-at: ${TJOR_LAUNCHED_AT:-}
      tjor.confighash: ${TJOR_CONFIG_HASH:-unset}
