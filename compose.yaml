# tjor cage topology. Driven by bin/tjor, which exports every TJOR_* variable.
#
# Layout (charter L1/L2/L28): the agent lives on an internal-only network;
# proxy and dns sidecars are created on the egress network FIRST and then
# connected to the internal network by the launcher (docker network connect)
# — published ports and route-derived addresses bind against the creation-
# time network, so the ordering is load-bearing. The agent reaches sidecars
# by their internal IPs, exported by the launcher after connection.

name: ${TJOR_PROJECT:-tjor}

networks:
  # The internal network is created by the launcher (docker network create
  # --internal) BEFORE compose runs, so sidecars are provably created on the
  # egress network first and connected to internal second (charter L28).
  internal:
    external: true
    name: ${TJOR_PROJECT:-tjor}_internal
  egress: {}

# The proxy confdir (session CA) is a session-dir bind mount: the launcher
# pre-generates a CONSTRAINED CA there (basicConstraints pathlen:0 + EKU
# serverAuth, charter L25). Only the CERT is ever mounted into the agent;
# the private key stays in the sidecar-only directory.

services:
  proxy:
    image: ${TJOR_PROXY_IMAGE:?}
    networks: [egress]
    restart: unless-stopped
    mem_limit: ${TJOR_PROXY_MEM:-1g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Image entrypoint (as root) stats the bind-mounted confdir, aligns the
    # mitmproxy user to its owning uid (usermod), then drops privileges.
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER]
    environment:
      TJOR_IP_GUARD: ${TJOR_IP_GUARD:-on}
    labels:
      tjor.role: proxy
      tjor.confighash: ${TJOR_CONFIG_HASH:-unset}
    volumes:
      - ${TJOR_SESSION_DIR:?}/policy.toml:/policy/policy.toml:ro
      - ${TJOR_SESSION_DIR:?}/proxy-ca:/home/mitmproxy/.mitmproxy
    command:
      [
        "mitmdump",
        "--mode", "regular",
        "--listen-host", "0.0.0.0",
        "--listen-port", "${TJOR_PROXY_PORT:-8080}",
        "-s", "/addon/addon.py",
        "--set", "stream_large_bodies=1m",
      ]

  dns:
    image: ${TJOR_COREDNS_IMAGE:?}
    networks: [egress]
    restart: unless-stopped
    mem_limit: ${TJOR_DNS_MEM:-256m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # binds :53
    labels:
      tjor.role: dns
      tjor.confighash: ${TJOR_CONFIG_HASH:-unset}
    volumes:
      - ${TJOR_SESSION_DIR:?}/Corefile:/Corefile:ro
    command: ["-conf", "/Corefile"]

  agent:
    profiles: [agent]
    image: ${TJOR_AGENT_IMAGE:-tjor-agent-opencode:local}
    networks: [internal]
    mem_limit: ${TJOR_AGENT_MEM:-4g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]   # entrypoint setup, then gosu drop
    # The sidecar IPs are discovered by the launcher after network connect.
    # The fallbacks are DELIBERATELY invalid sentinels, not usable values:
    # an unset DNS IP makes docker refuse to create the container, and an
    # unset proxy IP points at an unresolvable name on a closed network —
    # a missing discovery step fails hard instead of silently downgrading.
    dns:
      - ${TJOR_DNS_IP:-unset-dns-ip}
    environment:
      HTTP_PROXY: &proxyurl http://${TJOR_PROXY_IP:-unset-proxy-ip}:${TJOR_PROXY_PORT:-8080}
      HTTPS_PROXY: *proxyurl
      http_proxy: *proxyurl
      https_proxy: *proxyurl
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      NODE_EXTRA_CA_CERTS: /etc/tjor/ca/ca.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      TJOR_SESSION: ${TJOR_SESSION:-}
    volumes:
      - ${TJOR_SESSION_DIR:?}/home:/home/agent
      - ${TJOR_WORKSPACE:-/dev/null}:${TJOR_WORKSPACE:-/tmp/.tjor-nows}
      - ${TJOR_SESSION_DIR:?}/ca.pem:/etc/tjor/ca/ca.pem:ro
    working_dir: ${TJOR_LAUNCH_DIR:-/home/agent}
    hostname: tjor
    stdin_open: true
    tty: true

  conformance:
    profiles: [conformance]
    image: ${TJOR_CONFORMANCE_IMAGE:-tjor-conformance:local}
    networks: [internal]
    mem_limit: ${TJOR_CONFORMANCE_MEM:-512m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    dns:
      - ${TJOR_DNS_IP:-unset-dns-ip}
    environment:
      TJOR_PROXY_IP: ${TJOR_PROXY_IP:-}
      TJOR_DNS_IP: ${TJOR_DNS_IP:-}
      TJOR_PROXY_PORT: ${TJOR_PROXY_PORT:-8080}
