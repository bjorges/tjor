# tjor built-in defaults. Override in ~/.config/tjor/config.toml — never edit
# this file in an installed copy; upgrades replace it.

[proxy]
port = 8080
# Deny any allowed hostname that resolves to a non-global address (DNS-
# rebind / SSRF guard). Set false only if your allowlist includes intranet
# hosts on private ranges.
ip_guard = true

[identity]
# Hosts (globs) that receive this session's x-agent-* identity headers on
# intercepted requests — an explicit data-sharing decision (e.g. your LLM
# endpoints, per ADR 0005). Empty = never inject. Verification is always on:
# forged or unknown x-agent-* headers are stripped toward every host.
inject_hosts = []

[broker]
# Credential broker (D2): short-TTL, per-session credentials injected at the
# proxy toward `hosts` only — the agent holds only a placeholder, never the
# real secret. Empty `source` = disabled (session uses in-session `gh auth
# login`, the pre-broker default). All broker material lives ONLY in the
# proxy sidecar (egress side, unreachable from the agent network).
source = ""                              # "" | "github-app" | "pat"
hosts = ["github.com", "*.github.com", "codeload.github.com"]

# For source = "pat": name of a host-side env var holding the token (never
# the token itself in config). The launcher reads it and passes it to the
# proxy only.
pat_env = "TJOR_GITHUB_PAT"

# For source = "github-app": the App id, a path to its private key (PEM,
# host-side, never baked into any image), the installation id, and an
# optional repository allow-list for least-privilege scoping.
app_id = ""
private_key_path = ""
installation_id = ""
repositories = []

[limits]
# Memory caps per service (docker mem_limit syntax).
agent_mem = "4g"
proxy_mem = "1g"
dns_mem = "256m"
conformance_mem = "512m"

[dns]
# Extra DNS zones to forward beyond those derived from the policy allow-list.
# Required for any forwarding at all when the policy mode is default-allow.
extra_zones = []

[session]
root = "~/.tjor/sessions"

[versions]
# Harness and tool versions are config, not Dockerfile constants (charter L8).
# SHA256 values come from the publisher's release metadata (GitHub asset
# digests). Threat model per charter L23: verifies integrity of what was
# pinned, does not prove publisher authenticity behind a TLS-inspecting proxy.
opencode = "1.18.28"
claude_code = "2.1.260"   # npm exact-version pin (registry integrity applies)
copilot = "1.0.83"        # npm exact-version pin
# Official gh release binary, not the distro package: Debian's build ships a
# malformed trailing-space User-Agent in API calls, which the proxy's strict
# HTTP/2 validation rightly rejects.
gh = "2.100.0"

[versions.sha256]
opencode_linux_arm64 = "ccb0d39467eeccc52cdfe1cccad0114304366cb42073b906d970a487ca5b4497"
opencode_linux_x64 = "42add0fb1f13bdfd13855adc11cdaf2944c149377a873732168cdfd234fec7c3"
gh_linux_arm64 = "ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961"
gh_linux_amd64 = "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"

[images]
# Sidecar and base images pinned by digest (charter L11).
mitmproxy = "mitmproxy/mitmproxy:12.1.2@sha256:0d7b2a14b4a71a908cd6f31b8f50e29bbc5c8720fe6caa706acf782da558e5c7"
coredns = "coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1"
debian = "debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
python = "python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285"
