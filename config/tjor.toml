# tjor built-in defaults. Override in ~/.config/tjor/config.toml — never edit
# this file in an installed copy; upgrades replace it.

[proxy]
port = 8080
# Deny any allowed hostname that resolves to a non-global address (DNS-
# rebind / SSRF guard). Set false only if your allowlist includes intranet
# hosts on private ranges.
# The guard's DNS resolution is time-bounded and kept available under slow-DNS
# load (#59); the bounds are env-tunable on the proxy sidecar and rarely need
# changing: TJOR_RESOLVE_TIMEOUT (s), TJOR_RESOLVE_WORKERS,
# TJOR_RESOLVE_MAX_INFLIGHT, TJOR_RESOLVE_NEGATIVE_TTL (s). The proxy's OS
# resolver is also bounded (#61) so a hung/black-holed lookup recovers fast —
# tune via TJOR_PROXY_RES_OPTIONS (glibc RES_OPTIONS; default "timeout:1
# attempts:2"). Cap saturation is logged to the proxy's stderr (`docker logs`).
ip_guard = true

[identity]
# Hosts (globs) that receive this session's x-agent-* identity headers on
# intercepted requests — an explicit data-sharing decision (e.g. your LLM
# endpoints, per ADR 0005). Empty = never inject. Verification is always on:
# forged or unknown x-agent-* headers are stripped toward every host.
inject_hosts = []

[broker]
# Credential broker (D2): short-TTL, per-session credentials injected at the
# proxy toward `hosts` only — the agent holds only a placeholder, never the
# real secret. Empty `source` = disabled (session uses in-session `gh auth
# login`, the pre-broker default). All broker material lives ONLY in the
# proxy sidecar (egress side, unreachable from the agent network).
source = ""                              # "" | "github-app" | "pat" | "kube"
hosts = ["github.com", "*.github.com", "codeload.github.com"]

# For source = "pat": name of a host-side env var holding the token (never
# the token itself in config). The launcher reads it and passes it to the
# proxy only.
pat_env = "TJOR_GITHUB_PAT"

# For source = "github-app": the App id, a path to its private key (PEM,
# host-side, never baked into any image), the installation id, and an
# optional repository allow-list for least-privilege scoping.
app_id = ""
private_key_path = ""
installation_id = ""
repositories = []

# For source = "kube" (#26): at launch the host mints a short-TTL Kubernetes
# ServiceAccount token (`kubectl create token <kube_sa> -n <kube_namespace>
# --duration <kube_duration>`, using YOUR kubeconfig for cluster auth) and the
# proxy injects it as the bearer token toward the API server host ONLY. The
# agent gets a placeholder kubeconfig; the real token never enters the cage.
# RBAC is the action policy — bind the SA to whatever Role fits the session.
# Requires `kubectl` on the host; disabled loudly if minting fails. You must
# also allow the API host in the egress policy (`tjor policy add <api-host>`).
kube_sa = ""                             # ServiceAccount to mint a token for
kube_namespace = "default"               # its namespace
kube_duration = "1h"                     # token TTL (Go duration; no refresh)
# API server: derived from your current kubeconfig context by default. Setting
# this PINS the expected cluster (a full https://host:port URL, or a bare host
# assumed https) — it does not SELECT one: the flat form's token is always
# minted against your ACTIVE context, so at launch the pin is validated against
# that context's server and a mismatch disables the broker (#58). To target a
# specific cluster (or several), use [[broker.kube_clusters]] below instead.
kube_api_host = ""

# Multi-cluster (#57): instead of the flat single-cluster keys above, list the
# clusters this session may reach. Each entry mints a token against its OWN
# named context (`kubectl create token <kube_sa> --context <context> …`), and
# the agent gets ONE kubeconfig with a context per cluster — switch between them
# live with `kubectl config use-context <context>`, no restart. Each cluster's
# token is injected only toward that cluster's exact API origin (a token never
# reaches another cluster). Static at launch: there is no way to add a cluster
# to a running session. ALL-OR-NOTHING and fail-closed: if any listed cluster
# can't validate/mint, or two resolve to the same API origin, the WHOLE broker
# is disabled (never a session with a context that has no working token). Allow
# every cluster's API host in the egress policy (`tjor policy add <api-host>` —
# tjor prints one line per cluster at launch). When this list is present it
# takes precedence over the flat kube_sa/kube_namespace/kube_api_host keys.
#
#   [[broker.kube_clusters]]
#   context   = "prod-aks"     # the kubectl context to mint against (required)
#   kube_sa   = "agent-ro"     # ServiceAccount in that cluster (required)
#   kube_namespace = "team-a"  # optional (default "default")
#   kube_duration  = "1h"      # optional token TTL (default "1h")
#   api_host  = ""             # optional pin, validated against the context (#58)
#
#   [[broker.kube_clusters]]
#   context   = "staging-eks"
#   kube_sa   = "agent-ro"

[gateway]
# Optional LiteLLM gateway (D4). When enabled, a LiteLLM sidecar runs on the
# EGRESS network and the harness's base_url points at it — the agent reaches it
# only through the proxy, so the egress policy gains exactly ONE host (this
# gateway) instead of one per provider. The gateway's admin surface is
# unreachable from the agent by construction (the proxy allows only inference
# paths toward it); a per-install master key is generated, kept only in the
# gateway + proxy sidecars, and injected by the proxy — the agent never holds
# it. Bring your own provider keys via provider_key_envs (they stay egress-side).
enabled = false
host = "tjor-gateway"                    # the single allow-listed gateway host
port = 4000
# Host env vars whose VALUES are passed only into the gateway sidecar (your
# provider API keys); referenced from models below as os.environ/<VAR>.
provider_key_envs = []

# One table per model the caged harness may request. `name` is what the agent
# asks for; the rest is LiteLLM params. Reference provider keys by env only.
# [[gateway.models]]
# name = "gpt-4o"
# model = "openai/gpt-4o"
# api_key = "os.environ/OPENAI_API_KEY"

[limits]
# Memory caps per service (docker mem_limit syntax).
agent_mem = "4g"
proxy_mem = "1g"
dns_mem = "256m"
conformance_mem = "512m"
gateway_mem = "2g"          # LiteLLM gateway sidecar (D4), when enabled
# Process-count cap on the agent container (#10 hardening): a DoS/fork-bomb
# ceiling. Generous by default so real multi-process work (parallel builds,
# test runners) is unaffected — any finite cap stops a runaway. Raise it if a
# legitimate workload needs more.
agent_pids = 4096

[secrets]
# Egress discovered-secret tripwire (#62, ADR 0011). OBSERVE-ONLY and best-effort:
# the proxy scans outbound inference request bodies for known secret SHAPES and
# surfaces a count at `tjor down` — it never alters, blocks, or delays a request,
# and it is NOT a guarantee (an agent can trivially base64/split/encode around
# it). Its value is catching ACCIDENTAL verbatim leaks.
# Inference hosts to scan. The LLM gateway host is auto-included when [gateway]
# is enabled; list additional inference hosts here for gateway-less setups
# (empty = only the gateway host, or nothing if the gateway is off).
scan_hosts = []
# Bytes of each request body scanned (a pasted secret is near the top of a
# prompt; bounds hot-path cost). Beyond this is not scanned.
scan_max_bytes = 262144

[dns]
# Extra DNS zones to forward beyond those derived from the policy allow-list.
# Required for any forwarding at all when the policy mode is default-allow.
extra_zones = []

[session]
root = "~/.tjor/sessions"

# Agent profiles (#29): named host directories of harness DEFINITIONS
# (agents/commands/skills) you can opt a session into with `tjor run --profile
# <name>` (or ad-hoc with `--profile-dir <path>`). Only definition subdirs are
# staged — agent/agents, command/commands, skill/skills, prompt/prompts,
# mode/modes — never credential/auth files, so pointing at ~/.opencode does NOT
# import your API keys. The profile overlays the image's baseline instructions.
[profiles]
# mine = "~/.opencode"
# review = "~/.config/tjor/profiles/review"

# Kernel-sandbox tier (#9): the entrypoint probes Landlock from inside the
# cage and, when available, runs the harness under cplt's Landlock backend —
# kernel FS denies (e.g. in-repo .env reads) covering what the container
# boundary doesn't. Strictly additive: cplt's network layer stays off (the
# egress proxy is the sole network boundary). Modes:
#   auto    — enforce when the runtime supports it; otherwise degrade LOUDLY
#             (a persistent statement names the inactive tier) and continue.
#   require — unavailable aborts the launch before the harness starts
#             (promotes the add-on to a core guarantee).
#   off     — tier disabled; stated once at start.
[landlock]
mode = "auto"
# Launch-time secret masking: dotenv-style files (.env, .env.* — except
# example/sample/template) present in the mounted repos at launch are masked
# with a read-only /dev/null bind mount, so their contents are unreadable
# in-cage on EVERY runtime (Landlock is allowlist-only and cannot deny a path
# inside the granted workspace — cplt states this at runtime; the mask is the
# mechanism that actually delivers the in-repo secret protection). Residual,
# documented honestly: a dotenv file created mid-session is not masked.
mask_dotenv = true
# Extra mask paths (absolute; host path == container path for repo mounts).
# Config can only EXTEND the default deny set, never weaken it.
deny_paths = []
# Directory masking (#43): each entry is either an ABSOLUTE directory path
# (masked directly when present at launch) or a bare directory NAME with no
# slash (e.g. ".opencode"), discovered recursively in every mounted repo. A
# matching directory is bind-mounted over with a read-only EMPTY directory,
# so it is structurally empty in-cage on every runtime — this is what closes
# the project-config execution surface (.opencode/plugins and .opencode/tools
# auto-load arbitrary code in opencode) for hardened setups, structurally
# rather than by detection. Applied independently of mask_dotenv. Glob
# patterns are not supported; anything that is neither an absolute path nor a
# bare name aborts the launch. Residual, stated honestly: a directory created
# mid-session is not masked (launch-time snapshot, like mask_dotenv).
# Recommended for hardened/read-only investigation profiles:
#   mask_dirs = [".opencode"]
mask_dirs = []

[versions]
# Harness and tool versions are config, not Dockerfile constants (charter L8).
# SHA256 values come from the publisher's release metadata (GitHub asset
# digests). Threat model per charter L23: verifies integrity of what was
# pinned, does not prove publisher authenticity behind a TLS-inspecting proxy.
opencode = "1.18.28"
claude_code = "2.1.260"   # npm exact-version pin (registry integrity applies)
copilot = "1.0.83"        # npm exact-version pin
# Official gh release binary, not the distro package: Debian's build ships a
# malformed trailing-space User-Agent in API calls, which the proxy's strict
# HTTP/2 validation rightly rejects.
gh = "2.100.0"
# kubectl for the kube broker source (#26); official dl.k8s.io binary, per-arch
# sha256-gated. Only used in-cage when a session talks to a cluster.
kubectl = "1.37.0"
# cplt for the kernel-sandbox tier (#9); official navikt/cplt release tarball
# (date-based tag), per-arch sha256-gated from the release's SHA256SUMS.
cplt = "2026.09.13-135112-daf7f1f"

[versions.sha256]
opencode_linux_arm64 = "ccb0d39467eeccc52cdfe1cccad0114304366cb42073b906d970a487ca5b4497"
opencode_linux_x64 = "42add0fb1f13bdfd13855adc11cdaf2944c149377a873732168cdfd234fec7c3"
gh_linux_arm64 = "ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961"
gh_linux_amd64 = "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be"
kubectl_linux_amd64 = "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f"
kubectl_linux_arm64 = "922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3"
cplt_linux_arm64 = "2ed30c0ad2506e52214c2aff3fefc0131abbb2ace449fabb40a2b95d1975d135"
cplt_linux_amd64 = "acfc886997ef1d92ccaf5ee181f2cf3ae822d915dce2f26e2b5776473c4b445a"

[images]
# Prebuilt agent images (#21): with `publish` on, an installed (non-git) copy
# of tjor pulls the prebuilt image for its version from `registry` on first
# run instead of building locally; a git checkout always builds locally. Set
# publish=false to always build from the audited Dockerfile. See ADR 0008 for
# the trust trade-off of pulling vs building.
publish = true
registry = "ghcr.io/bjorges"

# Sidecar and base images pinned by digest (charter L11).
mitmproxy = "mitmproxy/mitmproxy:12.1.2@sha256:0d7b2a14b4a71a908cd6f31b8f50e29bbc5c8720fe6caa706acf782da558e5c7"
coredns = "coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1"
debian = "debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
python = "python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285"
# LiteLLM gateway (D4), only pulled when [gateway] enabled. Digest-pinned
# (charter L11) so the gateway runs exactly this image, not a moving tag.
litellm = "ghcr.io/berriai/litellm:main-stable@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa"

# VERIFIED pull path: a per-harness image digest (sha256:...) makes the pull
# exactly what was published — independent of the mutable tag, as trustworthy
# as a local build (charter L11). Recorded per release; empty = pull by tag
# (with a printed integrity notice). Prefer digests for a security posture.
# (Subsection MUST stay at the end of [images] — TOML captures the scalar
# keys above only while no subsection header has appeared yet.)
[images.digests]
# opencode = "sha256:..."
# claude = "sha256:..."
# copilot = "sha256:..."
