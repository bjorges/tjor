name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA (charter L23: mutable tags are not pins).
jobs:
  unit:
    name: unit + parity + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      # mitmproxy pinned to the version the proxy image runs (config/tjor.toml
      # images.mitmproxy) so the multidict tests exercise the real behavior,
      # not a future release that only happens to pass here.
      - run: pip install pytest 'mitmproxy==12.1.2'
      - name: unit, corpus, call-site parity, and addon-guard tests
        run: python -m pytest python/tests -q
      - name: shellcheck
        run: shellcheck bin/tjor images/agent/entrypoint.sh proxy/entrypoint.sh

  agent-image:
    name: agent image (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: opencode
            binary: opencode
          - harness: claude
            binary: claude
          - harness: copilot
            binary: copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build ${{ matrix.harness }} agent image (checksum/pin-gated)
        run: ./bin/tjor build --harness ${{ matrix.harness }}
      - name: image contract — non-root user, harness present, cargo present
        run: |
          docker run --rm --entrypoint bash tjor-agent-${{ matrix.harness }}:local -c '
            [ "$(su agent -c "id -u")" != "0" ] || { echo "agent is root"; exit 1; }
            command -v ${{ matrix.binary }} >/dev/null || { echo "${{ matrix.binary }} missing"; exit 1; }
            test -f /opt/tjor/instructions/opencode/AGENTS.md || { echo "instruction cargo missing"; exit 1; }
          '
      - name: checksum gate must reject a tampered artifact (negative path)
        if: matrix.harness == 'opencode'
        run: |
          cfg() { python3 python/tjor_cfg.py get "$1"; }
          if docker build -f images/agent/Dockerfile \
              --build-arg BASE_IMAGE="$(cfg images.debian)" \
              --build-arg HARNESS=opencode \
              --build-arg OPENCODE_VERSION="$(cfg versions.opencode)" \
              --build-arg OPENCODE_SHA256_ARM64=deadbeef \
              --build-arg OPENCODE_SHA256_X64=deadbeef \
              --build-arg GH_VERSION="$(cfg versions.gh)" \
              --build-arg GH_SHA256_ARM64="$(cfg versions.sha256.gh_linux_arm64)" \
              --build-arg GH_SHA256_AMD64="$(cfg versions.sha256.gh_linux_amd64)" \
              -t tjor-agent-tampered:ci . >/dev/null 2>&1; then
            echo "FATAL: a tampered checksum still built — the gate is defanged"; exit 1
          fi
          echo "checksum gate held against tampered artifact"

  conformance:
    name: conformance (live topology, Linux engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run adversarial conformance suite
        run: ./bin/tjor conformance

  lifecycle:
    name: lifecycle (live sessions, Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]   # don't declare lifecycle green if the image/gate job failed
    timeout-minutes: 20    # bound orphaned docker state if the live test hangs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run session-lifecycle integration test
        run: tests/integration/lifecycle_test.sh

  broker:
    name: broker (agent-absence, Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run credential-broker integration test
        run: tests/integration/broker_test.sh
