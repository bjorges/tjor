name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA (charter L23: mutable tags are not pins).
jobs:
  unit:
    name: unit + parity + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # mitmproxy pinned to the version the proxy image runs (config/tjor.toml
      # images.mitmproxy) so the multidict tests exercise the real behavior,
      # not a future release that only happens to pass here.
      - run: pip install pytest 'mitmproxy==12.1.2'
      - name: unit, corpus, call-site parity, and addon-guard tests
        run: python -m pytest python/tests -q
      - name: kube broker wiring (mocked kubectl, no cluster) (#26)
        run: bash tests/integration/kube_test.sh
      - name: shellcheck
        # --severity=warning: fail on real bugs (warning/error), not info-level
        # findings like SC2317 (trap-invoked functions look "unreachable"),
        # whose exact code varies by shellcheck version.
        run: shellcheck --severity=warning bin/tjor images/agent/entrypoint.sh proxy/entrypoint.sh tests/*.sh tests/integration/*.sh
      - name: doc-consistency (README shipped markers vs roadmap table)
        run: tests/doc_consistency.sh

  agent-image:
    name: agent image (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: opencode
            binary: opencode
          - harness: claude
            binary: claude
          - harness: copilot
            binary: copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build ${{ matrix.harness }} agent image (checksum/pin-gated)
        run: ./bin/tjor build --harness ${{ matrix.harness }}
      - name: image contract — non-root user, harness present, cargo present
        run: |
          want_kubectl="$(python3 python/tjor_cfg.py get versions.kubectl)"
          docker run --rm --entrypoint bash -e WANT_KUBECTL="${want_kubectl}" tjor-agent-${{ matrix.harness }}:local -c '
            [ "$(su agent -c "id -u")" != "0" ] || { echo "agent is root"; exit 1; }
            command -v ${{ matrix.binary }} >/dev/null || { echo "${{ matrix.binary }} missing"; exit 1; }
            test -f /opt/tjor/instructions/AGENTS.md || { echo "neutral instruction cargo missing"; exit 1; }
            # kube broker (#26): pinned kubectl + the tjor_kube.py the entrypoint renders with
            command -v kubectl >/dev/null || { echo "kubectl missing"; exit 1; }
            kubectl version --client 2>/dev/null | grep -q "v${WANT_KUBECTL}" || { echo "kubectl not at pinned v${WANT_KUBECTL}"; kubectl version --client; exit 1; }
            test -f /opt/tjor/python/tjor_kube.py || { echo "tjor_kube.py missing from image"; exit 1; }
          '
      - name: harness wiring (#24) — entrypoint deploys cargo to the dialect path + disables self-update
        run: |
          # Run the REAL entrypoint with TJOR_HARNESS set; it deploys the neutral
          # instruction file into this harness's own dialect path, then exec's
          # our check as the agent user.
          docker run --rm -e TJOR_HARNESS=${{ matrix.harness }} -e H=${{ matrix.harness }} \
            tjor-agent-${{ matrix.harness }}:local bash -c '
              set -e
              home=/home/agent
              case "$H" in
                opencode) f="$home/.config/opencode/AGENTS.md";
                          grep -q "\"autoupdate\": false" "$home/.config/opencode/opencode.json" \
                            || { echo "opencode self-update not disabled"; exit 1; } ;;
                claude)   f="$home/.claude/CLAUDE.md" ;;
                copilot)  f="$home/.copilot/copilot-instructions.md" ;;
              esac
              test -s "$f" || { echo "instruction cargo not deployed to $f"; exit 1; }
              grep -q "tjor cage" "$f" || { echo "cargo content wrong in $f"; exit 1; }
              echo "ok: $H instruction cargo deployed to $f"
            '
      - name: agent profile deploy (#29) — definitions in, credentials out (real entrypoint)
        if: matrix.harness == 'opencode'
        run: bash tests/integration/profile_test.sh
      - name: kube placeholder-config symlink-follow regression (real entrypoint)
        if: matrix.harness == 'opencode'
        run: bash tests/integration/kube_symlink_test.sh
      - name: checksum gate must reject a tampered artifact (negative path)
        if: matrix.harness == 'opencode'
        run: |
          cfg() { python3 python/tjor_cfg.py get "$1"; }
          if docker build -f images/agent/Dockerfile \
              --build-arg BASE_IMAGE="$(cfg images.debian)" \
              --build-arg HARNESS=opencode \
              --build-arg OPENCODE_VERSION="$(cfg versions.opencode)" \
              --build-arg OPENCODE_SHA256_ARM64=deadbeef \
              --build-arg OPENCODE_SHA256_X64=deadbeef \
              --build-arg GH_VERSION="$(cfg versions.gh)" \
              --build-arg GH_SHA256_ARM64="$(cfg versions.sha256.gh_linux_arm64)" \
              --build-arg GH_SHA256_AMD64="$(cfg versions.sha256.gh_linux_amd64)" \
              --build-arg KUBECTL_VERSION="$(cfg versions.kubectl)" \
              --build-arg KUBECTL_SHA256_ARM64="$(cfg versions.sha256.kubectl_linux_arm64)" \
              --build-arg KUBECTL_SHA256_AMD64="$(cfg versions.sha256.kubectl_linux_amd64)" \
              -t tjor-agent-tampered:ci . >/dev/null 2>&1; then
            echo "FATAL: a tampered checksum still built — the gate is defanged"; exit 1
          fi
          echo "checksum gate held against tampered artifact"

  conformance:
    name: conformance (live topology, Linux engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run adversarial conformance suite
        run: ./bin/tjor conformance

  lifecycle:
    name: lifecycle (live sessions, Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]   # don't declare lifecycle green if the image/gate job failed
    timeout-minutes: 20    # bound orphaned docker state if the live test hangs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run session-lifecycle integration test
        run: tests/integration/lifecycle_test.sh

  broker:
    name: broker (agent-absence, Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run credential-broker integration test
        run: tests/integration/broker_test.sh

  multirepo:
    name: multi-repo (two repos, Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run multi-repo integration test
        run: tests/integration/multirepo_test.sh

  ergonomics:
    name: config + policy ergonomics (Linux engine)
    runs-on: ubuntu-latest
    needs: [agent-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run config + ergonomics integration test
        run: tests/integration/ergonomics_test.sh

  uid:
    name: uid-agnostic image (non-default uid)
    runs-on: ubuntu-latest
    needs: [agent-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run uid-agnostic image test
        run: tests/integration/uid_test.sh

  multiarch-build:
    name: agent image builds multi-arch (amd64+arm64, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: buildx opencode agent for both platforms (uid-agnostic, no push)
        run: |
          cfg() { python3 python/tjor_cfg.py get "$1"; }
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f images/agent/Dockerfile \
            --build-arg BASE_IMAGE="$(cfg images.debian)" \
            --build-arg HARNESS=opencode \
            --build-arg OPENCODE_VERSION="$(cfg versions.opencode)" \
            --build-arg OPENCODE_SHA256_ARM64="$(cfg versions.sha256.opencode_linux_arm64)" \
            --build-arg OPENCODE_SHA256_X64="$(cfg versions.sha256.opencode_linux_x64)" \
            --build-arg GH_VERSION="$(cfg versions.gh)" \
            --build-arg GH_SHA256_ARM64="$(cfg versions.sha256.gh_linux_arm64)" \
            --build-arg GH_SHA256_AMD64="$(cfg versions.sha256.gh_linux_amd64)" \
            --build-arg KUBECTL_VERSION="$(cfg versions.kubectl)" \
            --build-arg KUBECTL_SHA256_ARM64="$(cfg versions.sha256.kubectl_linux_arm64)" \
            --build-arg KUBECTL_SHA256_AMD64="$(cfg versions.sha256.kubectl_linux_amd64)" \
            .
      - name: buildx proxy for both platforms (no push)
        run: |
          cfg() { python3 python/tjor_cfg.py get "$1"; }
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f images/proxy/Dockerfile \
            --build-arg BASE_IMAGE="$(cfg images.mitmproxy)" \
            .
