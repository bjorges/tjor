name: publish-images

# Build and push prebuilt, uid-agnostic, multi-arch agent images (plus proxy
# and conformance) to GHCR on each release tag, so `tjor run` pulls instead of
# building on first use. Also creates the GitHub Release from the tag's
# CHANGELOG section, so tagging is the only manual release step. Separate from
# the test CI: a publish failure never blocks tests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [opencode, claude, copilot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: build args from config pins
        id: args
        run: |
          cfg() { python3 python/tjor_cfg.py get "$1"; }
          {
            echo "base=$(cfg images.debian)"
            echo "opencode=$(cfg versions.opencode)"
            echo "oc_arm=$(cfg versions.sha256.opencode_linux_arm64)"
            echo "oc_x64=$(cfg versions.sha256.opencode_linux_x64)"
            echo "claude=$(cfg versions.claude_code)"
            echo "copilot=$(cfg versions.copilot)"
            echo "gh=$(cfg versions.gh)"
            echo "gh_arm=$(cfg versions.sha256.gh_linux_arm64)"
            echo "gh_amd=$(cfg versions.sha256.gh_linux_amd64)"
            echo "kubectl=$(cfg versions.kubectl)"
            echo "kubectl_arm=$(cfg versions.sha256.kubectl_linux_arm64)"
            echo "kubectl_amd=$(cfg versions.sha256.kubectl_linux_amd64)"
            echo "cplt=$(cfg versions.cplt)"
            echo "cplt_arm=$(cfg versions.sha256.cplt_linux_arm64)"
            echo "cplt_amd=$(cfg versions.sha256.cplt_linux_amd64)"
          } >> "$GITHUB_OUTPUT"
      - name: build & push ${{ matrix.harness }} (amd64+arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # No AGENT_UID: the image is uid-agnostic (aligned at runtime).
          build-args: |
            BASE_IMAGE=${{ steps.args.outputs.base }}
            HARNESS=${{ matrix.harness }}
            OPENCODE_VERSION=${{ steps.args.outputs.opencode }}
            OPENCODE_SHA256_ARM64=${{ steps.args.outputs.oc_arm }}
            OPENCODE_SHA256_X64=${{ steps.args.outputs.oc_x64 }}
            CLAUDE_CODE_VERSION=${{ steps.args.outputs.claude }}
            COPILOT_VERSION=${{ steps.args.outputs.copilot }}
            GH_VERSION=${{ steps.args.outputs.gh }}
            GH_SHA256_ARM64=${{ steps.args.outputs.gh_arm }}
            GH_SHA256_AMD64=${{ steps.args.outputs.gh_amd }}
            KUBECTL_VERSION=${{ steps.args.outputs.kubectl }}
            KUBECTL_SHA256_ARM64=${{ steps.args.outputs.kubectl_arm }}
            KUBECTL_SHA256_AMD64=${{ steps.args.outputs.kubectl_amd }}
            CPLT_VERSION=${{ steps.args.outputs.cplt }}
            CPLT_SHA256_ARM64=${{ steps.args.outputs.cplt_arm }}
            CPLT_SHA256_AMD64=${{ steps.args.outputs.cplt_amd }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tjor-agent-${{ matrix.harness }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tjor-agent-${{ matrix.harness }}:latest

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: base
        name: digest-pinned proxy base from config (charter L11)
        run: echo "image=$(python3 python/tjor_cfg.py get images.mitmproxy)" >> "$GITHUB_OUTPUT"
      - name: build & push proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tjor-proxy:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tjor-proxy:latest

  release:
    # Create the GitHub Release for the pushed tag, with the matching
    # CHANGELOG section as the notes. Deliberately independent of the image
    # jobs: a failed image build should not hide the release notes (re-run the
    # failed job instead). Idempotent: an existing release is left untouched.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: extract release notes from CHANGELOG
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (grab) exit; if (index($0, "## [" ver "]") == 1) grab = 1; next }
            grab { print }
          ' CHANGELOG.md > notes.md
          # Title from the heading: "## [X.Y.Z] — date — <title>" -> "<title>"
          title="$(sed -n "s/^## \[${ver}\] — [0-9-]* — //p" CHANGELOG.md | head -1)"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it untouched"
            exit 0
          fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME — ${TITLE:-release}" --notes-file notes.md
          else
            echo "::warning::no CHANGELOG section for $GITHUB_REF_NAME; using generated notes"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
