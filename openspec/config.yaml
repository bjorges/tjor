schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  tjor runs AI coding agents inside a fail-closed container cage. Specs under
  openspec/specs/ are the unit of shipped functionality; docs/decisions/ holds ADRs.
  An overview slide deck (slides/presentations/overview/slides.md, published to
  GitHub Pages) explains every capability: one or more slides per problem, each
  tagged `specs: [<capability>@<spec-file hash pin>]`. tests/slides_consistency.sh
  fails CI when a capability has no slide or its spec file changed without the
  slide being reviewed. See slides/agents.md ("Keeping the deck in sync").
  Work happens on a branch and lands through a pull request with green CI;
  nothing is committed or pushed to main directly (CONTRIBUTING.md).

rules:
  specs:
    - >-
      A new capability needs a `problem` slide in slides/presentations/overview/slides.md
      tagged "specs: [<capability>@<pin>]" (the pin tests/slides_consistency.sh prints) and
      an entry on the map slide; a changed spec needs its slide re-read and the pin updated.
  tasks:
    - >-
      When a change adds or alters user-visible functionality, include a task to update
      the overview deck (slides/agents.md, "Keeping the deck in sync") and to run
      tests/slides_consistency.sh.

operations:
  apply:
    guidance:
      - Work on a branch, never on main; land the change through a pull request with
        green CI (CONTRIBUTING.md). Do not push to main.
      - Before finishing, run the local gates (python -m pytest python/tests -q,
        tests/doc_consistency.sh, tests/slides_consistency.sh, shellcheck on changed
        shell files) and regenerate docs/boundary-matrix.md when a probe changed.
      - A user-visible change gets a CHANGELOG.md entry under the `## [Unreleased]` heading
        and, when a spec changed, a reviewed slide (slides/agents.md).
  archive:
    guidance:
      - Archive on the same branch as the implementation, so the pull request carries both.
