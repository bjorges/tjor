schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  tjor runs AI coding agents inside a fail-closed container cage. Specs under
  openspec/specs/ are the unit of shipped functionality; docs/decisions/ holds ADRs.
  An overview slide deck (slides/presentations/overview/slides.md, published to
  GitHub Pages) explains every capability: one or more slides per problem, each
  tagged `specs: [<capability>@<requirement count>]`. tests/slides_consistency.sh
  fails CI when a capability has no slide or its requirement count moved without
  the slide being reviewed. See slides/agents.md ("Keeping the deck in sync").

rules:
  specs:
    - >-
      A new capability needs a `problem` slide in slides/presentations/overview/slides.md
      tagged "specs: [<capability>@N]" (N = its "### Requirement:" count) and an entry on
      the map slide; a changed capability needs its slide re-read and the pin bumped.
  tasks:
    - >-
      When a change adds or alters user-visible functionality, include a task to update
      the overview deck (slides/agents.md, "Keeping the deck in sync") and to run
      tests/slides_consistency.sh.
